[mod-setting-description]
resource-patch-organizer-lock-surface=Limit collection and printing of resources to a single surface
resource-patch-organizer-allow-fluids=Allow Resource Organiser to collect Fluids
resource-patch-organizer-allow-solids=Allow Resource Organiser to collect Solids
resource-patch-organizer-fluid-grid=Grid spacing for fluids. Pumpjacks are 3x3. 6 = 3 tile spacing between Pumpjacks
resource-patch-organizer-special-ore-grid=Tiles between each building. Primarily used for SE Core Miner and K2 Quarry
resource-patch-organizer-grid-spacing=The amount of tile gap between Pumpjacks and other modded buildings that are placed on single resource nodes
resource-patch-organizer-allow-mixing=Allows patchwork placement around other Ores
resource-patch-organizer-noise=Print solid ores as a natural rounded patch - rich in the centre and thinning out toward the edges - instead of a filled square. Only affects spread (ore) resources, not fluids
resource-patch-organizer-noise-falloff=How much lighter the ore yield gets toward the edge of the patch. The patch is always one solid, contiguous body with an irregular outline. Higher values make the centre noticeably richer than the edges; lower values spread the ore more evenly
resource-patch-organizer-noise-waviness=How irregular (lumpy) the patch outline is. 0 gives a smooth ellipse; higher values make the edge bulge in and out more for a more organic, less circular shape. The patch always stays one solid, connected body - waviness only reshapes the outline, it does not create gaps. Very high values can carve the outline in quite deeply, making the patch noticeably smaller than the selected area
resource-patch-organizer-debug=Prints extra information when collecting or placing resources. Use for debugging purposes only